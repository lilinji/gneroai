name: Deploy mdBook to GitHub Pages and Vercel

on:
  push:
    branches: [main]
    paths:
      - 'docs/book/src/**'
      - 'docs/book/book.toml'
      - 'docs/book-en/src/**'
      - 'docs/book-en/book.toml'
      - '.github/workflows/deploy-book.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install mdbook

      - name: Build book
        run: |
          source $HOME/.cargo/env
          mdbook build docs/book

      - name: Build book-en
        run: |
          source $HOME/.cargo/env
          mdbook build docs/book-en

      - name: Prepare combined output
        run: |
          cp -r docs/book-en/book docs/book/book/en

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: docs/book/book


  deploy-gh-pages:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download book artifact
        uses: actions/download-artifact@v4
        with:
          name: book
          path: docs/book/book

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./docs/book/book
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download book artifact
        uses: actions/download-artifact@v4
        with:
          name: book
          path: docs/book/book

      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          vercel deploy ./docs/book/book --yes --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
