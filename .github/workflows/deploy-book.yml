name: Deploy mdBook to GitHub Pages and Vercel

on:
  push:
    branches: [main]
    paths:
      - 'docs/book/src/**'
      - 'docs/book/book.toml'
      - 'docs/book-en/src/**'
      - 'docs/book-en/book.toml'
      - '.github/workflows/deploy-book.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install mdbook

      - name: Build Chinese book
        run: |
          source $HOME/.cargo/env
          cd docs/book
          mdbook build

      - name: Build English book
        run: |
          source $HOME/.cargo/env
          cd docs/book-en
          mdbook build

      - name: Copy English book to Chinese book output
        run: |
          cp -r docs/book-en/book docs/book/book/en

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: docs/book/book

  deploy-gh-pages:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download book artifact
        uses: actions/download-artifact@v4
        with:
          name: book
          path: docs/book/book

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./docs/book/book
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download book artifact
        uses: actions/download-artifact@v4
        with:
          name: book
          path: public

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m "Update built book for Vercel [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
